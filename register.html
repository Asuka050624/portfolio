<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>用户注册 - 宠物健康管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/register.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">用户注册</div>
        <div class="back-btn" id="backBtn">
            <img src="images/back.png" alt="返回">
        </div>
    </nav>

    <!-- 注册表单 -->
    <div class="register-container">
        <form id="registerForm">
            <div class="form-group">
                <label for="regUsername">用户名</label>
                <input type="text" id="regUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="regPassword">密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label for="regConfirmPassword">确认密码</label>
                <input type="password" id="regConfirmPassword" placeholder="请再次输入密码">
            </div>
            <div class="form-group">
                <label for="regPhone">手机号码</label>
                <input type="tel" id="regPhone" placeholder="请输入手机号码">
            </div>
            <div class="form-group">
                <label for="regEmail">邮箱</label>
                <input type="email" id="regEmail" placeholder="请输入邮箱（选填）">
            </div>
            <button type="submit" class="register-btn">注册</button>
        </form>
    </div>

    <!-- 错误提示弹窗 -->
    <div class="modal" id="errorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>提示</h3>
                <button class="close-modal">×</button>
            </div>
            <div class="modal-body">
                <p id="errorMessage"></p>
                <button class="confirm-btn">确定</button>
            </div>
        </div>
    </div>
</body>
</html>
