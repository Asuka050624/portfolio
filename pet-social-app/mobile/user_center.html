<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>用户中心 - 宠物健康管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/init.js"></script>
    <script src="js/user_center.js"></script>
    <style>
        .home-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-btn img {
            width: 24px;
            height: 24px;
        }
        .nav-actions {
            display: flex;
            gap: 10px;
        }
        .back-btn {
            cursor: pointer;
            padding: 5px;
        }
        .back-btn img {
            width: 24px;
            height: 24px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="back-btn" id="backBtn">
            <img src="images/back.png" alt="返回">
        </div>
        <div class="logo">用户中心</div>
        <div class="home-btn" id="homeBtn">
            <img src="images/home-active.png" alt="首页">
        </div>
    </nav>

    <!-- 用户信息区域 -->
    <div class="user-info-section">
        <div class="current-time" id="currentTime"></div>
        <div class="user-avatar">
            <img src="images/user_avatar.png" alt="用户头像" id="userAvatar">
        </div>
        <div class="user-details">
            <h3 id="userName">加载中...</h3>
            <p id="userEmail">--</p>
        </div>
    </div>

    <!-- 功能列表 -->
    <div class="function-list">
        <!-- 我的订单 -->
        <div class="function-item" id="myOrders">
            <div class="function-icon">
                <img src="images/orders.png" alt="我的订单">
            </div>
            <div class="function-text">我的订单</div>
            <div class="function-arrow">
                <img src="images/arrow.png" alt="箭头">
            </div>
        </div>

        <!-- 我的预约 -->
        <div class="function-item" id="myReservations">
            <div class="function-icon">
                <img src="images/reservation.png" alt="我的预约">
            </div>
            <div class="function-text">我的预约</div>
            <div class="function-arrow">
                <img src="images/arrow.png" alt="箭头">
            </div>
        </div>

        <!-- 我的反馈 -->
        <div class="function-item" id="myFeedbacks">
            <div class="function-icon">
                <img src="images/feedback.png" alt="我的反馈">
            </div>
            <div class="function-text">我的反馈</div>
            <div class="function-arrow">
                <img src="images/arrow.png" alt="箭头">
            </div>
        </div>

        <!-- 个人设置 -->
        <div class="function-item" id="settings">
            <div class="function-icon">
                <img src="images/settings.png" alt="个人设置">
            </div>
            <div class="function-text">个人设置</div>
            <div class="function-arrow">
                <img src="images/arrow.png" alt="箭头">
            </div>
        </div>
    </div>

    <!-- 退出登录按钮 -->
    <div class="logout-section">
        <button id="logoutBtn" class="logout-btn">退出登录</button>
    </div>

    <!-- 成功提示弹窗 -->
    <div class="modal" id="successModal">
        <div class="modal-content success-content">
            <div class="modal-body">
                <p id="successMessage">操作成功</p>
                <button class="close-modal" id="closeSuccessModal">确定</button>
            </div>
        </div>
    </div>
</body>
</html>
