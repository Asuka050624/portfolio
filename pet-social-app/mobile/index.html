<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物健康管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/main.js"></script>
    <!-- 内联JavaScript修复图片显示问题 -->
    <script>
        // 确保DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 修复图片显示问题
            const images = document.querySelectorAll('img');
            images.forEach(img => {
                // 确保图片路径正确，如果图片加载失败，尝试替换为占位图
                img.onerror = function() {
                    console.log('图片加载失败:', this.src);
                    // 设置基本样式确保图片可见
                    this.style.display = 'block';
                    this.style.maxWidth = '100%';
                    this.style.height = 'auto';
                };
                // 立即应用样式确保图片可见
                img.style.display = 'block';
                img.style.maxWidth = '100%';
                img.style.height = 'auto';
            });
        });
    </script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">宠物健康管理系统</div>
        <div class="navbar-right">
            <div class="current-time" id="currentTime"></div>
            <div class="user-avatar" id="userAvatar">
                <img src="images/user.png" alt="用户头像">
            </div>
        </div>
    </nav>

    <!-- 轮播图 -->
    <div class="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/carousel1.png" alt="轮播图1">
            </div>
            <div class="carousel-item">
                <img src="images/carousel2.png" alt="轮播图2">
            </div>
            <div class="carousel-item">
                <img src="images/carousel3.png" alt="轮播图3">
            </div>
        </div>
        <div class="carousel-indicators">
            <span class="indicator active"></span>
            <span class="indicator"></span>
            <span class="indicator"></span>
        </div>
    </div>

    <!-- 功能模块 -->
    <div class="feature-modules">
        <div class="module-item" id="newsModule">
            <img src="images/news.png" alt="宠物资讯">
            <span>宠物资讯</span>
        </div>
        <div class="module-item" id="reservationModule">
            <img src="images/reservation.png" alt="挂号预约">
            <span>挂号预约</span>
        </div>
        <div class="module-item" id="shopModule">
            <img src="images/shop.png" alt="宠物商城">
            <span>宠物商城</span>
        </div>
        <div class="module-item" id="feedbackModule">
            <img src="images/feedback.png" alt="反馈中心">
            <span>反馈中心</span>
        </div>
    </div>

    <!-- 宠物资讯 -->
    <div class="news-section">
        <div class="section-title">
            <h3>宠物资讯</h3>
            <a href="news.html" class="more">更多 ></a>
        </div>
        <div class="news-list">
            <a href="news_detail_1.html" class="news-item-link">
                <div class="news-item">
                    <img src="images/news1.jpg" alt="资讯图片">
                    <div class="news-content">
                        <h4>宠物春季常见疾病预防指南</h4>
                        <p>春季是宠物疾病的高发期，提前了解这些预防知识可以让你的宠物更健康...</p>
                        <span class="news-time">2025-10-15</span>
                    </div>
                </div>
            </a>
            <a href="news_detail_2.html" class="news-item-link">
                <div class="news-item">
                    <img src="images/news2.jpg" alt="资讯图片">
                    <div class="news-content">
                        <h4>新手养狗必学：基础训练技巧</h4>
                        <p>作为一名新的狗主人，掌握这些基础训练技巧可以帮助你更好地与宠物相处...</p>
                        <span class="news-time">2025-10-10</span>
                    </div>
                </div>
            </a>
            <style>
                .news-item-link {
                    display: block;
                    text-decoration: none;
                    color: inherit;
                    cursor: pointer;
                    width: 100%;
                    margin-bottom: 10px;
                }
                .news-item {
                    width: 100%;
                    cursor: pointer;
                }
                .news-item:active {
                    background-color: #f5f5f5;
                }
            </style>
        </div>
    </div>

    <!-- 商城推荐 -->
    <div class="shop-section">
        <div class="section-title">
            <h3>热门推荐</h3>
            <a href="shop.html" class="more">更多 ></a>
        </div>
        <div class="product-list">
            <div class="product-item" data-id="1">
                <img src="images/product1.jpg" alt="宠物罐头">
                <h4>优质宠物罐头</h4>
                <div class="price">
                    <span class="current-price">¥29.90</span>
                    <span class="original-price">¥39.90</span>
                </div>
                <button class="add-to-cart">加入购物车</button>
            </div>
            <div class="product-item" data-id="2">
                <img src="images/product2.jpg" alt="宠物玩具">
                <h4>宠物互动玩具球</h4>
                <div class="price">
                    <span class="current-price">¥19.90</span>
                    <span class="original-price">¥29.90</span>
                </div>
                <button class="add-to-cart">加入购物车</button>
            </div>
            <div class="product-item" data-id="3">
                <img src="images/product3.jpg" alt="宠物衣服">
                <h4>宠物秋冬保暖衣服</h4>
                <div class="price">
                    <span class="current-price">¥59.90</span>
                    <span class="original-price">¥89.90</span>
                </div>
                <button class="add-to-cart">加入购物车</button>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <img src="images/home-active.png" alt="首页">
            <span>首页</span>
        </a>
        <a href="shop.html" class="nav-item">
            <img src="images/shop.png" alt="商城">
            <span>商城</span>
        </a>
        <a href="reservation.html" class="nav-item">
            <img src="images/reservation.png" alt="预约">
            <span>预约</span>
        </a>
        <a href="user_center.html" class="nav-item">
            <img src="images/user.png" alt="我的">
            <span>我的</span>
        </a>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>用户登录</h3>
                <button class="close-modal">×</button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" placeholder="请输入密码">
                    </div>
                    <button type="submit" class="login-btn">登录</button>
                    <div class="login-footer">
                        <a href="register.html">注册账号</a>
                        <a href="#" id="forgotPassword">忘记密码</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
