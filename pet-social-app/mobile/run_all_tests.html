<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动化测试执行器 - 宠物健康管理系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }
        h2 {
            color: #2980b9;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .control-panel {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }
        .start-btn {
            padding: 15px 30px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .start-btn:hover {
            background-color: #218838;
        }
        .start-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .reset-btn {
            padding: 10px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 15px;
        }
        .reset-btn:hover {
            background-color: #c82333;
        }
        .progress-container {
            margin: 20px 0;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
        }
        .progress-bar {
            height: 25px;
            background-color: #e9ecef;
            border-radius: 15px;
            margin-top: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background-color: #3498db;
            transition: width 0.5s;
            position: relative;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2c3e50;
            font-weight: bold;
        }
        .status-summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
        }
        .status-item {
            text-align: center;
        }
        .status-label {
            display: block;
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 5px;
        }
        .status-value {
            display: block;
            font-size: 24px;
            font-weight: bold;
        }
        .status-value.success {
            color: #28a745;
        }
        .status-value.error {
            color: #dc3545;
        }
        #test-results {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 10px;
        }
        .test-result-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid;
        }
        .test-result-item.running {
            background-color: #e3f2fd;
            border-left-color: #2196f3;
        }
        .test-result-item.success {
            background-color: #e8f5e9;
            border-left-color: #4caf50;
        }
        .test-result-item.error {
            background-color: #ffebee;
            border-left-color: #f44336;
        }
        .test-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .test-status {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .test-output {
            font-size: 14px;
            color: #555;
            font-family: monospace;
        }
        .system-info {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }
        .system-info h3 {
            color: #495057;
            margin-top: 0;
        }
        .system-info ul {
            list-style-type: none;
            padding-left: 20px;
        }
        .system-info li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>宠物健康管理系统 - 自动化测试执行器</h1>
        
        <div class="control-panel">
            <button id="start-tests-btn" class="start-btn">开始执行所有测试</button>
            <button id="clear-storage-btn" class="reset-btn">清除本地存储</button>
        </div>
        
        <div class="progress-container">
            <div>测试进度：</div>
            <div class="progress-bar">
                <div id="progress-bar" class="progress-fill" style="width: 0%;">
                    <div id="progress-text" class="progress-text">准备就绪</div>
                </div>
            </div>
        </div>
        
        <div id="status-summary" class="status-summary">
            <div class="status-item">
                <span class="status-label">总测试数:</span>
                <span class="status-value">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">通过:</span>
                <span class="status-value success">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">失败:</span>
                <span class="status-value error">0</span>
            </div>
        </div>
        
        <h2>测试结果</h2>
        <div id="test-results"></div>
        
        <div class="system-info">
            <h3>系统信息</h3>
            <ul>
                <li><strong>测试模块：</strong>登录、预约、反馈、用户中心</li>
                <li><strong>测试用例数：</strong>21个</li>
                <li><strong>测试环境：</strong>基于浏览器本地存储</li>
                <li><strong>注意事项：</strong>测试前请确保清除浏览器缓存，以获得准确的测试结果</li>
            </ul>
        </div>
    </div>
    
    <script>
        // 模拟登录功能
        function mockLogin(username = 'user', password = '123456') {
            try {
                // 模拟原始登录逻辑
                const isMatch = username.toLowerCase() === 'user' && password === '123456';
                if (isMatch) {
                    localStorage.setItem('user', JSON.stringify({ username: username }));
                    localStorage.setItem('isLoggedIn', 'true');
                    return true;
                }
                return false;
            } catch (e) {
                console.error('登录模拟失败:', e);
                return false;
            }
        }
        
        // 模拟登出功能
        function mockLogout() {
            try {
                localStorage.removeItem('user');
                localStorage.removeItem('isLoggedIn');
                return true;
            } catch (e) {
                console.error('登出模拟失败:', e);
                return false;
            }
        }
        
        // 获取登录状态
        function getLoginStatus() {
            try {
                const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
                const user = localStorage.getItem('user');
                return { isLoggedIn, user: user ? JSON.parse(user) : null };
            } catch (e) {
                console.error('获取登录状态失败:', e);
                return { isLoggedIn: false, user: null };
            }
        }
        
        // 验证手机号码格式
        function isValidPhone(phone) {
            const phoneRegex = /^1[3-9]\d{9}$/;
            return phoneRegex.test(phone);
        }
        
        // 验证邮箱格式
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        // 保存预约数据
        function saveReservation(reservationData) {
            try {
                const reservations = JSON.parse(localStorage.getItem('reservations') || '[]');
                reservations.push(reservationData);
                localStorage.setItem('reservations', JSON.stringify(reservations));
                return true;
            } catch (e) {
                console.error('保存预约数据失败:', e);
                return false;
            }
        }
        
        // 保存反馈数据
        function saveFeedback(feedbackData) {
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                return true;
            } catch (e) {
                console.error('保存反馈数据失败:', e);
                return false;
            }
        }
        
        // 登录模块测试用例
        function testLoginValidCredentials() {
            try {
                mockLogout(); // 确保测试开始前已登出
                const result = mockLogin('user', '123456');
                const status = getLoginStatus();
                return {
                    success: result && status.isLoggedIn,
                    output: result && status.isLoggedIn ? '正确凭据登录成功' : '正确凭据登录失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testLoginInvalidUsername() {
            try {
                mockLogout();
                const result = mockLogin('invalid', '123456');
                const status = getLoginStatus();
                return {
                    success: !result && !status.isLoggedIn,
                    output: !result && !status.isLoggedIn ? '错误用户名被正确拒绝' : '错误用户名测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testLoginInvalidPassword() {
            try {
                mockLogout();
                const result = mockLogin('user', 'wrong');
                const status = getLoginStatus();
                return {
                    success: !result && !status.isLoggedIn,
                    output: !result && !status.isLoggedIn ? '错误密码被正确拒绝' : '错误密码测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testLoginEmptyFields() {
            try {
                mockLogout();
                // 测试空用户名
                const result1 = mockLogin('', '123456');
                // 测试空密码
                const result2 = mockLogin('user', '');
                // 测试都为空
                const result3 = mockLogin('', '');
                
                return {
                    success: !result1 && !result2 && !result3,
                    output: !result1 && !result2 && !result3 ? '空字段测试通过' : '空字段测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testLoginCaseInsensitive() {
            try {
                mockLogout();
                // 测试大写用户名
                const result1 = mockLogin('USER', '123456');
                const status1 = getLoginStatus();
                mockLogout();
                // 测试混合大小写
                const result2 = mockLogin('UsEr', '123456');
                const status2 = getLoginStatus();
                
                return {
                    success: (result1 && status1.isLoggedIn) && (result2 && status2.isLoggedIn),
                    output: (result1 && status1.isLoggedIn) && (result2 && status2.isLoggedIn) ? '大小写不敏感测试通过' : '大小写不敏感测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testLoginSessionPersistence() {
            try {
                mockLogout();
                mockLogin('user', '123456');
                
                // 模拟页面刷新后检查登录状态
                const status = getLoginStatus();
                
                return {
                    success: status.isLoggedIn,
                    output: status.isLoggedIn ? '登录状态保持测试通过' : '登录状态保持测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        // 预约模块测试用例
        function testReservationRequiredFields() {
            try {
                // 保存原始数据
                const originalReservations = localStorage.getItem('reservations');
                
                // 测试必填字段验证
                const requiredFieldsTest = {
                    petName: '',
                    petType: '猫',
                    serviceType: '常规检查',
                    appointmentDate: '2024-12-31',
                    appointmentTime: '10:00',
                    contactPhone: '13800138000'
                };
                
                // 检查必填字段是否为空
                const hasEmptyRequired = !requiredFieldsTest.petName || !requiredFieldsTest.petType || 
                                        !requiredFieldsTest.serviceType || !requiredFieldsTest.appointmentDate || 
                                        !requiredFieldsTest.appointmentTime || !requiredFieldsTest.contactPhone;
                
                // 恢复原始数据
                if (originalReservations) {
                    localStorage.setItem('reservations', originalReservations);
                } else {
                    localStorage.removeItem('reservations');
                }
                
                return {
                    success: hasEmptyRequired,
                    output: hasEmptyRequired ? '必填字段验证测试通过' : '必填字段验证测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testReservationSubmit() {
            try {
                // 保存原始数据
                const originalReservations = localStorage.getItem('reservations');
                
                // 先登录
                mockLogin();
                
                // 创建测试预约数据
                const testReservation = {
                    id: 'RES' + Date.now(),
                    username: 'user',
                    petName: '测试宠物',
                    petType: '猫',
                    serviceType: '常规检查',
                    appointmentDate: '2024-12-31',
                    appointmentTime: '10:00',
                    contactPhone: '13800138000',
                    status: 'pending'
                };
                
                // 保存预约
                const result = saveReservation(testReservation);
                
                // 验证保存成功
                const reservations = JSON.parse(localStorage.getItem('reservations') || '[]');
                const reservationExists = reservations.some(r => r.id === testReservation.id);
                
                // 恢复原始数据
                if (originalReservations) {
                    localStorage.setItem('reservations', originalReservations);
                } else {
                    localStorage.removeItem('reservations');
                }
                
                mockLogout();
                
                return {
                    success: result && reservationExists,
                    output: result && reservationExists ? '预约提交测试通过' : '预约提交测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testReservationPhoneFormat() {
            try {
                // 测试不同格式的电话号码
                const validPhone = isValidPhone('13800138000');
                const invalidPhone1 = isValidPhone('1234567890'); // 不是1开头
                const invalidPhone2 = isValidPhone('1380013800'); // 长度不对
                const invalidPhone3 = isValidPhone('138001380000'); // 长度不对
                
                return {
                    success: validPhone && !invalidPhone1 && !invalidPhone2 && !invalidPhone3,
                    output: validPhone && !invalidPhone1 && !invalidPhone2 && !invalidPhone3 ? '电话号码格式测试通过' : '电话号码格式测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testReservationNotLoggedIn() {
            try {
                mockLogout(); // 确保未登录
                
                // 尝试在未登录状态下预约
                const testReservation = {
                    id: 'RES' + Date.now(),
                    username: '',
                    petName: '测试宠物',
                    petType: '猫',
                    serviceType: '常规检查',
                    appointmentDate: '2024-12-31',
                    appointmentTime: '10:00',
                    contactPhone: '13800138000'
                };
                
                // 验证未登录状态
                const status = getLoginStatus();
                
                return {
                    success: !status.isLoggedIn,
                    output: !status.isLoggedIn ? '未登录状态测试通过' : '未登录状态测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testReservationDataStorage() {
            try {
                // 保存原始数据
                const originalReservations = localStorage.getItem('reservations');
                
                // 清空现有数据
                localStorage.removeItem('reservations');
                
                // 创建多个测试预约
                const reservationsToTest = [
                    {
                        id: 'RES' + Date.now() + '1',
                        username: 'user',
                        petName: '宠物1',
                        petType: '猫',
                        serviceType: '常规检查',
                        appointmentDate: '2024-12-31',
                        appointmentTime: '10:00',
                        contactPhone: '13800138000'
                    },
                    {
                        id: 'RES' + Date.now() + '2',
                        username: 'user',
                        petName: '宠物2',
                        petType: '狗',
                        serviceType: '疫苗接种',
                        appointmentDate: '2024-12-30',
                        appointmentTime: '14:00',
                        contactPhone: '13900139000'
                    }
                ];
                
                // 保存所有预约
                reservationsToTest.forEach(res => saveReservation(res));
                
                // 获取保存的数据
                const savedReservations = JSON.parse(localStorage.getItem('reservations') || '[]');
                
                // 验证所有预约都被保存
                const allSaved = reservationsToTest.every(testRes => 
                    savedReservations.some(savedRes => savedRes.id === testRes.id)
                );
                
                // 恢复原始数据
                if (originalReservations) {
                    localStorage.setItem('reservations', originalReservations);
                } else {
                    localStorage.removeItem('reservations');
                }
                
                return {
                    success: allSaved,
                    output: allSaved ? '预约数据存储测试通过' : '预约数据存储测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        // 反馈模块测试用例
        function testFeedbackFormValidation() {
            try {
                // 测试反馈表单验证
                const validFeedback = {
                    feedbackType: '建议',
                    content: '这是一个有效的反馈内容，超过10个字符',
                    contact: 'test@example.com'
                };
                
                // 检查必填字段
                const hasEmptyRequired = !validFeedback.feedbackType || !validFeedback.content;
                // 检查内容长度
                const contentLengthValid = validFeedback.content.length >= 10;
                // 检查联系方式格式
                const contactValid = validFeedback.contact ? 
                    (isValidEmail(validFeedback.contact) || isValidPhone(validFeedback.contact)) : 
                    true;
                
                return {
                    success: !hasEmptyRequired && contentLengthValid && contactValid,
                    output: !hasEmptyRequired && contentLengthValid && contactValid ? '反馈表单验证测试通过' : '反馈表单验证测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testFeedbackSubmit() {
            try {
                // 保存原始数据
                const originalFeedbacks = localStorage.getItem('feedbacks');
                
                // 创建测试反馈数据
                const testFeedback = {
                    id: 'FEED' + Date.now(),
                    username: 'test_user',
                    feedbackType: '建议',
                    content: '这是一个测试反馈内容，用于自动化测试',
                    contact: 'test@example.com',
                    timestamp: new Date().toISOString()
                };
                
                // 保存反馈
                const result = saveFeedback(testFeedback);
                
                // 验证保存成功
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                const feedbackExists = feedbacks.some(f => f.id === testFeedback.id);
                
                // 恢复原始数据
                if (originalFeedbacks) {
                    localStorage.setItem('feedbacks', originalFeedbacks);
                } else {
                    localStorage.removeItem('feedbacks');
                }
                
                return {
                    success: result && feedbackExists,
                    output: result && feedbackExists ? '反馈提交测试通过' : '反馈提交测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testFeedbackContactFormat() {
            try {
                // 测试不同格式的联系方式
                const validEmail = isValidEmail('test@example.com');
                const validPhone = isValidPhone('13800138000');
                const invalidContact1 = isValidEmail('invalid-email') || isValidPhone('invalid-email');
                const invalidContact2 = isValidEmail('123456') || isValidPhone('123456');
                
                return {
                    success: validEmail && validPhone && !invalidContact1 && !invalidContact2,
                    output: validEmail && validPhone && !invalidContact1 && !invalidContact2 ? '联系方式格式测试通过' : '联系方式格式测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testFeedbackNotLoggedIn() {
            try {
                mockLogout(); // 确保未登录
                
                // 验证未登录状态下也能提交反馈
                const testFeedback = {
                    id: 'FEED' + Date.now(),
                    username: '', // 未登录用户没有用户名
                    feedbackType: '问题',
                    content: '未登录用户的反馈测试',
                    contact: 'guest@example.com'
                };
                
                const status = getLoginStatus();
                const canSubmit = !status.isLoggedIn; // 未登录状态也应该能提交反馈
                
                return {
                    success: canSubmit,
                    output: canSubmit ? '未登录状态反馈测试通过' : '未登录状态反馈测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testFeedbackDataStorage() {
            try {
                // 保存原始数据
                const originalFeedbacks = localStorage.getItem('feedbacks');
                
                // 清空现有数据
                localStorage.removeItem('feedbacks');
                
                // 创建多个测试反馈
                const feedbacksToTest = [
                    {
                        id: 'FEED' + Date.now() + '1',
                        username: 'user1',
                        feedbackType: '建议',
                        content: '这是第一条测试反馈',
                        contact: 'user1@example.com'
                    },
                    {
                        id: 'FEED' + Date.now() + '2',
                        username: 'user2',
                        feedbackType: '问题',
                        content: '这是第二条测试反馈',
                        contact: '13800138001'
                    }
                ];
                
                // 保存所有反馈
                feedbacksToTest.forEach(feedback => saveFeedback(feedback));
                
                // 获取保存的数据
                const savedFeedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                
                // 验证所有反馈都被保存
                const allSaved = feedbacksToTest.every(testFeedback => 
                    savedFeedbacks.some(savedFeedback => savedFeedback.id === testFeedback.id)
                );
                
                // 恢复原始数据
                if (originalFeedbacks) {
                    localStorage.setItem('feedbacks', originalFeedbacks);
                } else {
                    localStorage.removeItem('feedbacks');
                }
                
                return {
                    success: allSaved,
                    output: allSaved ? '反馈数据存储测试通过' : '反馈数据存储测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        // 用户中心模块测试用例
        function testUserCenterLoginStatus() {
            try {
                // 测试未登录状态
                mockLogout();
                let status = getLoginStatus();
                const notLoggedIn = !status.isLoggedIn;
                
                // 测试登录状态
                mockLogin();
                status = getLoginStatus();
                const isLoggedIn = status.isLoggedIn;
                
                return {
                    success: notLoggedIn && isLoggedIn,
                    output: notLoggedIn && isLoggedIn ? '登录状态检查测试通过' : '登录状态检查测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testUserCenterInfoDisplay() {
            try {
                mockLogin('test_user', '123456');
                const status = getLoginStatus();
                
                return {
                    success: status.user && status.user.username === 'test_user',
                    output: status.user && status.user.username === 'test_user' ? '用户信息显示测试通过' : '用户信息显示测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testUserCenterLogout() {
            try {
                mockLogin(); // 先登录
                const logoutResult = mockLogout(); // 执行登出
                const status = getLoginStatus(); // 检查登出后状态
                
                return {
                    success: logoutResult && !status.isLoggedIn,
                    output: logoutResult && !status.isLoggedIn ? '退出登录测试通过' : '退出登录测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testUserCenterStorageCompatibility() {
            try {
                // 清除现有登录状态
                localStorage.removeItem('user');
                localStorage.removeItem('isLoggedIn');
                
                // 测试旧格式的登录状态检测
                localStorage.setItem('isLoggedIn', 'true');
                let status = getLoginStatus();
                const oldFormatDetected = status.isLoggedIn;
                
                // 清除并测试新格式
                localStorage.removeItem('isLoggedIn');
                localStorage.setItem('user', JSON.stringify({ username: 'test_user' }));
                localStorage.setItem('isLoggedIn', 'true');
                status = getLoginStatus();
                const newFormatDetected = status.isLoggedIn && status.user && status.user.username === 'test_user';
                
                return {
                    success: oldFormatDetected && newFormatDetected,
                    output: oldFormatDetected && newFormatDetected ? '存储兼容性测试通过' : '存储兼容性测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function testUserDataManagement() {
            try {
                // 保存原始数据
                const originalReservations = localStorage.getItem('reservations');
                const originalFeedbacks = localStorage.getItem('feedbacks');
                
                // 清除测试数据
                localStorage.removeItem('reservations');
                localStorage.removeItem('feedbacks');
                
                // 先登录
                mockLogin();
                
                // 创建测试数据
                const testUser = '测试用户';
                
                // 创建测试预约数据
                const testReservation = {
                    id: 'RES' + Date.now(),
                    username: testUser,
                    petName: '测试宠物',
                    petType: '猫',
                    serviceType: '常规检查',
                    appointmentDate: '2024-12-31',
                    appointmentTime: '10:00',
                    status: 'pending'
                };
                
                // 创建测试反馈数据
                const testFeedback = {
                    id: 'FEED' + Date.now(),
                    username: testUser,
                    feedbackType: '建议',
                    content: '测试反馈内容',
                    contact: 'test@example.com',
                    timestamp: new Date().toISOString()
                };
                
                // 测试保存用户数据
                const reservations = JSON.parse(localStorage.getItem('reservations') || '[]');
                reservations.push(testReservation);
                localStorage.setItem('reservations', JSON.stringify(reservations));
                
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(testFeedback);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 验证数据保存成功
                const savedReservations = JSON.parse(localStorage.getItem('reservations') || '[]');
                const savedFeedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                
                const reservationExists = savedReservations.some(r => r.id === testReservation.id);
                const feedbackExists = savedFeedbacks.some(f => f.id === testFeedback.id);
                
                // 恢复原始数据
                if (originalReservations) {
                    localStorage.setItem('reservations', originalReservations);
                } else {
                    localStorage.removeItem('reservations');
                }
                
                if (originalFeedbacks) {
                    localStorage.setItem('feedbacks', originalFeedbacks);
                } else {
                    localStorage.removeItem('feedbacks');
                }
                
                mockLogout();
                
                return {
                    success: reservationExists && feedbackExists,
                    output: reservationExists && feedbackExists ? '用户数据管理测试通过' : '用户数据管理测试失败'
                };
            } catch (e) {
                return {
                    success: false,
                    output: `测试执行异常: ${e.message}`
                };
            }
        }
        
        function runAllTests() {
            const resultsContainer = document.getElementById('test-results');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const statusSummary = document.getElementById('status-summary');
            const clearButton = document.getElementById('clear-storage-btn');
            
            // 禁用开始按钮
            document.getElementById('start-tests-btn').disabled = true;
            
            // 清空结果容器
            resultsContainer.innerHTML = '';
            
            // 测试用例数组
            const tests = [
                // 登录模块测试
                { name: '登录测试 - 正确凭据', testFunction: testLoginValidCredentials },
                { name: '登录测试 - 错误用户名', testFunction: testLoginInvalidUsername },
                { name: '登录测试 - 错误密码', testFunction: testLoginInvalidPassword },
                { name: '登录测试 - 空字段', testFunction: testLoginEmptyFields },
                { name: '登录测试 - 大小写不敏感', testFunction: testLoginCaseInsensitive },
                { name: '登录测试 - 登录状态保持', testFunction: testLoginSessionPersistence },
                
                // 预约模块测试
                { name: '预约测试 - 必填字段验证', testFunction: testReservationRequiredFields },
                { name: '预约测试 - 数据提交', testFunction: testReservationSubmit },
                { name: '预约测试 - 电话号码格式', testFunction: testReservationPhoneFormat },
                { name: '预约测试 - 未登录状态', testFunction: testReservationNotLoggedIn },
                { name: '预约测试 - 数据存储', testFunction: testReservationDataStorage },
                
                // 反馈模块测试
                { name: '反馈测试 - 表单验证', testFunction: testFeedbackFormValidation },
                { name: '反馈测试 - 提交测试', testFunction: testFeedbackSubmit },
                { name: '反馈测试 - 联系方式格式', testFunction: testFeedbackContactFormat },
                { name: '反馈测试 - 未登录状态', testFunction: testFeedbackNotLoggedIn },
                { name: '反馈测试 - 数据存储', testFunction: testFeedbackDataStorage },
                
                // 用户中心模块测试
                { name: '用户中心测试 - 登录状态检查', testFunction: testUserCenterLoginStatus },
                { name: '用户中心测试 - 用户信息显示', testFunction: testUserCenterInfoDisplay },
                { name: '用户中心测试 - 退出登录', testFunction: testUserCenterLogout },
                { name: '用户中心测试 - 存储兼容性', testFunction: testUserCenterStorageCompatibility },
                { name: '用户中心测试 - 用户数据管理', testFunction: testUserDataManagement }
            ];
            
            let passedTests = 0;
            let failedTests = 0;
            let currentTest = 0;
            
            // 逐个执行测试
            function executeNextTest() {
                if (currentTest >= tests.length) {
                    // 所有测试执行完毕
                    progressBar.style.width = '100%';
                    progressText.textContent = '测试完成: 100%';
                    
                    // 更新状态摘要
                    statusSummary.innerHTML = `
                        <div class="status-item">
                            <span class="status-label">总测试数:</span>
                            <span class="status-value">${tests.length}</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">通过:</span>
                            <span class="status-value success">${passedTests}</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">失败:</span>
                            <span class="status-value error">${failedTests}</span>
                        </div>
                    `;
                    
                    // 启用开始按钮
                    document.getElementById('start-tests-btn').disabled = false;
                    
                    // 启用清除存储按钮
                    clearButton.disabled = false;
                    
                    return;
                }
                
                const test = tests[currentTest];
                const resultItem = document.createElement('div');
                resultItem.className = 'test-result-item running';
                resultItem.innerHTML = `
                    <div class="test-name">${test.name}</div>
                    <div class="test-status">运行中...</div>
                    <div class="test-output"></div>
                `;
                resultsContainer.appendChild(resultItem);
                
                // 执行测试
                setTimeout(() => {
                    const result = test.testFunction();
                    
                    // 更新测试结果显示
                    if (result.success) {
                        resultItem.className = 'test-result-item success';
                        resultItem.querySelector('.test-status').textContent = '通过';
                        passedTests++;
                    } else {
                        resultItem.className = 'test-result-item error';
                        resultItem.querySelector('.test-status').textContent = '失败';
                        failedTests++;
                    }
                    
                    resultItem.querySelector('.test-output').textContent = result.output;
                    
                    // 更新进度
                    currentTest++;
                    const progressPercentage = Math.floor((currentTest / tests.length) * 100);
                    progressBar.style.width = `${progressPercentage}%`;
                    progressText.textContent = `执行进度: ${progressPercentage}%`;
                    
                    // 滚动到底部
                    resultsContainer.scrollTop = resultsContainer.scrollHeight;
                    
                    // 执行下一个测试
                    setTimeout(executeNextTest, 300); // 稍微延迟以显示结果
                }, 500);
            }
            
            // 开始执行测试
            executeNextTest();
        }
        
        function clearStorage() {
            if (confirm('确定要清除所有本地存储数据吗？这将重置测试环境。')) {
                localStorage.removeItem('user');
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('reservations');
                localStorage.removeItem('feedbacks');
                localStorage.removeItem('cart');
                alert('本地存储已清除');
            }
        }
        
        // 页面加载完成后绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('start-tests-btn').addEventListener('click', runAllTests);
            document.getElementById('clear-storage-btn').addEventListener('click', clearStorage);
        });
    </script>
