<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录功能测试 - 宠物健康管理系统</title>
    <script src="js/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
        }
        .test-case {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .test-case h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .failed {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .test-btn {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .test-btn:hover {
            background-color: #45a049;
        }
        .test-output {
            margin-top: 10px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 3px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>宠物健康管理系统 - 登录功能测试</h1>
    
    <div class="test-case">
        <h3>测试用例1：正确的用户名和密码</h3>
        <p>测试使用正确的用户名（user）和密码（123456）进行登录</p>
        <button class="test-btn" onclick="testValidLogin()">执行测试</button>
        <div class="test-output" id="output1"></div>
        <div class="result" id="result1"></div>
    </div>
    
    <div class="test-case">
        <h3>测试用例2：错误的用户名</h3>
        <p>测试使用错误的用户名和正确的密码进行登录</p>
        <button class="test-btn" onclick="testInvalidUsername()">执行测试</button>
        <div class="test-output" id="output2"></div>
        <div class="result" id="result2"></div>
    </div>
    
    <div class="test-case">
        <h3>测试用例3：错误的密码</h3>
        <p>测试使用正确的用户名和错误的密码进行登录</p>
        <button class="test-btn" onclick="testInvalidPassword()">执行测试</button>
        <div class="test-output" id="output3"></div>
        <div class="result" id="result3"></div>
    </div>
    
    <div class="test-case">
        <h3>测试用例4：空用户名或密码</h3>
        <p>测试不输入用户名或密码的情况</p>
        <button class="test-btn" onclick="testEmptyFields()">执行测试</button>
        <div class="test-output" id="output4"></div>
        <div class="result" id="result4"></div>
    </div>
    
    <div class="test-case">
        <h3>测试用例5：大小写不敏感测试</h3>
        <p>测试用户名大小写不敏感的特性</p>
        <button class="test-btn" onclick="testCaseInsensitive()">执行测试</button>
        <div class="test-output" id="output5"></div>
        <div class="result" id="result5"></div>
    </div>
    
    <div class="test-case">
        <h3>测试用例6：登录状态保持测试</h3>
        <p>测试登录后localStorage中是否正确保存了用户状态</p>
        <button class="test-btn" onclick="testLoginStatus()">执行测试</button>
        <div class="test-output" id="output6"></div>
        <div class="result" id="result6"></div>
    </div>
    
    <script>
        // 登拟lo录函数，模gin.js中的验证逻辑
        function simulateLogin(username, password) {
            // 复制login.js中的验证逻辑
            if (!username || !password) {
                return { success: false, message: '请输入用户名和密码' };
            }
            
            // 修改为大小写不敏感，与login.js保持一致
            if (username.toLowerCase() === 'user' && password === '123456') {
                // 保存登录状态 - 模拟localStorage存储
                const user = {
                    username: username,
                    userId: 'user1',
                    isLogin: true
                };
                localStorage.setItem('user', JSON.stringify(user));
                return { success: true, message: '登录成功！' };
            } else {
                return { success: false, message: '用户名或密码错误' };
            }
        }
        
        // 清除登录状态
        function clearLoginState() {
            localStorage.removeItem('user');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
        }
        
        // 测试用例1：正确的用户名和密码
        function testValidLogin() {
            clearLoginState();
            const output = document.getElementById('output1');
            const result = document.getElementById('result1');
            
            output.textContent = '测试中...\n';
            output.textContent += '用户名: user\n';
            output.textContent += '密码: 123456\n\n';
            
            const loginResult = simulateLogin('user', '123456');
            output.textContent += `登录结果: ${loginResult.message}\n`;
            
            if (loginResult.success) {
                result.className = 'result success';
                result.textContent = '测试通过！';
            } else {
                result.className = 'result failed';
                result.textContent = '测试失败！';
            }
        }
        
        // 测试用例2：错误的用户名
        function testInvalidUsername() {
            clearLoginState();
            const output = document.getElementById('output2');
            const result = document.getElementById('result2');
            
            output.textContent = '测试中...\n';
            output.textContent += '用户名: invalid_user\n';
            output.textContent += '密码: 123456\n\n';
            
            const loginResult = simulateLogin('invalid_user', '123456');
            output.textContent += `登录结果: ${loginResult.message}\n`;
            
            if (!loginResult.success) {
                result.className = 'result success';
                result.textContent = '测试通过！(预期失败)';
            } else {
                result.className = 'result failed';
                result.textContent = '测试失败！(不应成功登录)';
            }
        }
        
        // 测试用例3：错误的密码
        function testInvalidPassword() {
            clearLoginState();
            const output = document.getElementById('output3');
            const result = document.getElementById('result3');
            
            output.textContent = '测试中...\n';
            output.textContent += '用户名: user\n';
            output.textContent += '密码: wrong_password\n\n';
            
            const loginResult = simulateLogin('user', 'wrong_password');
            output.textContent += `登录结果: ${loginResult.message}\n`;
            
            if (!loginResult.success) {
                result.className = 'result success';
                result.textContent = '测试通过！(预期失败)';
            } else {
                result.className = 'result failed';
                result.textContent = '测试失败！(不应成功登录)';
            }
        }
        
        // 测试用例4：空用户名或密码
        function testEmptyFields() {
            clearLoginState();
            const output = document.getElementById('output4');
            const result = document.getElementById('result4');
            
            output.textContent = '测试中...\n';
            output.textContent += '测试1: 空用户名\n';
            let loginResult = simulateLogin('', '123456');
            output.textContent += `结果1: ${loginResult.message}\n`;
            
            output.textContent += '\n测试2: 空密码\n';
            loginResult = simulateLogin('user', '');
            output.textContent += `结果2: ${loginResult.message}\n`;
            
            output.textContent += '\n测试3: 用户名和密码都为空\n';
            loginResult = simulateLogin('', '');
            output.textContent += `结果3: ${loginResult.message}\n`;
            
            result.className = 'result success';
            result.textContent = '测试完成！所有空字段测试都应失败。';
        }
        
        // 测试用例5：大小写不敏感测试
        function testCaseInsensitive() {
            clearLoginState();
            const output = document.getElementById('output5');
            const result = document.getElementById('result5');
            
            output.textContent = '测试中...\n';
            
            const testCases = ['USER', 'User', 'user', 'uSeR'];
            let allPassed = true;
            
            for (const username of testCases) {
                output.textContent += `用户名: ${username}\n`;
                const loginResult = simulateLogin(username, '123456');
                output.textContent += `结果: ${loginResult.message}\n`;
                
                if (!loginResult.success) {
                    allPassed = false;
                }
                clearLoginState();
                output.textContent += '\n';
            }
            
            if (allPassed) {
                result.className = 'result success';
                result.textContent = '测试通过！用户名大小写不敏感。';
            } else {
                result.className = 'result failed';
                result.textContent = '测试失败！用户名大小写不敏感功能未正常工作。';
            }
        }
        
        // 测试用例6：登录状态保持测试
        function testLoginStatus() {
            clearLoginState();
            const output = document.getElementById('output6');
            const result = document.getElementById('result6');
            
            output.textContent = '测试中...\n';
            output.textContent += '执行登录...\n';
            
            const loginResult = simulateLogin('user', '123456');
            output.textContent += `登录结果: ${loginResult.message}\n\n`;
            
            if (loginResult.success) {
                output.textContent += '检查localStorage中的用户状态...\n';
                const userData = localStorage.getItem('user');
                
                if (userData) {
                    try {
                        const user = JSON.parse(userData);
                        output.textContent += `用户数据: \n${JSON.stringify(user, null, 2)}\n\n`;
                        
                        if (user.isLogin === true && user.username === 'user') {
                            result.className = 'result success';
                            result.textContent = '测试通过！登录状态正确保存。';
                        } else {
                            result.className = 'result failed';
                            result.textContent = '测试失败！用户状态保存不完整。';
                        }
                    } catch (e) {
                        result.className = 'result failed';
                        result.textContent = '测试失败！无法解析用户数据。';
                        output.textContent += `错误: ${e.message}\n`;
                    }
                } else {
                    result.className = 'result failed';
                    result.textContent = '测试失败！localStorage中未找到用户数据。';
                }
            } else {
                result.className = 'result failed';
                result.textContent = '测试失败！登录未成功。';
            }
        }
    </script>
</body>
</html>
