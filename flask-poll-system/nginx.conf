# 事件配置块
events {
    worker_connections 1024;  # 每个工作进程的最大连接数
}

# HTTP配置块
http {
    # 定义上游服务器组（负载均衡）
    upstream poll_servers {
        server poll:5000;  # 第一个投票服务实例
        server poll-2:5000;  # 第二个投票服务实例
        server poll-3:5000;  # 第三个投票服务实例
    }

    # 虚拟服务器配置
    server {
        listen 80;  # 监听80端口

        # 根路径配置
        location / {
            proxy_pass http://poll_servers;  # 将请求代理到上游服务器组
            proxy_set_header Host $host;  # 传递原始Host头
            proxy_set_header X-Real-IP $remote_addr;  # 传递客户端真实IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 传递转发路径
            proxy_set_header X-Forwarded-Proto $scheme;  # 传递原始协议
        }
    }
}