<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>挂号预约 - 宠物健康管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/init.js"></script>
    <script src="js/reservation.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="back-btn" id="backBtn">
            <img src="images/back.png" alt="返回">
        </div>
        <div class="logo">挂号预约</div>
        <div class="navbar-right"></div>
    </nav>

    <!-- 预约表单卡片 -->
    <div class="reservation-container">
        <div class="section-card">
            <div class="card-header">
                <h3>预约信息</h3>
            </div>
            <div class="card-body">
                <form id="reservationForm">
                    <div class="form-group">
                        <label for="petName">宠物名称</label>
                        <input type="text" id="petName" placeholder="请输入宠物名称">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label for="petType">宠物类型</label>
                            <select id="petType">
                                <option value="">请选择宠物类型</option>
                                <option value="dog">狗狗</option>
                                <option value="cat">猫咪</option>
                                <option value="bird">鸟类</option>
                                <option value="fish">鱼类</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="otherPetTypeContainer" style="display: none;">
                        <label for="otherPetType">具体宠物类型</label>
                        <input type="text" id="otherPetType" placeholder="请输入具体的宠物类型">
                    </div>
                    <div class="form-group">
                        <label for="symptoms">症状描述</label>
                        <textarea id="symptoms" placeholder="请简要描述宠物的症状或就诊需求"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="doctor">预约医生</label>
                        <select id="doctor">
                            <option value="">请选择医生</option>
                            <option value="1">张医生 - 宠物内科</option>
                            <option value="2">李医生 - 宠物外科</option>
                            <option value="3">王医生 - 宠物皮肤科</option>
                            <option value="4">赵医生 - 宠物眼科</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label for="date">预约日期</label>
                            <input type="date" id="date">
                        </div>
                        <div class="form-group col-6">
                            <label for="time">预约时间</label>
                            <select id="time">
                                <option value="">请选择时间</option>
                                <option value="09:00">09:00-10:00</option>
                                <option value="10:00">10:00-11:00</option>
                                <option value="11:00">11:00-12:00</option>
                                <option value="14:00">14:00-15:00</option>
                                <option value="15:00">15:00-16:00</option>
                                <option value="16:00">16:00-17:00</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="contactName">联系人姓名</label>
                        <input type="text" id="contactName" placeholder="请输入联系人姓名">
                    </div>
                    <div class="form-group">
                        <label for="contactPhone">联系电话</label>
                        <input type="tel" id="contactPhone" placeholder="请输入联系电话">
                    </div>
                    <button type="submit" class="reservation-btn">提交预约</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 我的预约列表卡片 -->
    <div class="my-reservations">
        <div class="section-card">
            <div class="card-header">
                <h3>我的预约</h3>
            </div>
            <div class="card-body">
                <div class="reservation-list" id="reservationList">
                    <!-- 预约记录将动态添加 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 成功提示弹窗 -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>提示</h3>
                <button class="close-modal">×</button>
            </div>
            <div class="modal-body">
                <p>预约提交成功！</p>
                <button class="confirm-btn">确定</button>
            </div>
        </div>
    </div>
</body>
</html>
